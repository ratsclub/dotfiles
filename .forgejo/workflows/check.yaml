name: Check Nix Flake

run-name: "Check Nix Flake"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Run nix flake check
        run: nix flake check --impure
